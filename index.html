<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kierowca App Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --box-bg: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-orange: #ff9800;
            --accent-green: #4caf50;
            --accent-blue: #2196f3;
            --accent-red: #f44336;
            --accent-purple: #9c27b0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 500px; }
        h2 { text-align: center; margin: 10px 0 20px 0; font-size: 22px; }

        .status-card {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .status-card .state { font-size: 16px; margin-bottom: 5px; }
        .status-card .state span { color: var(--accent-orange); font-weight: bold; }
        .status-card .gps { font-size: 12px; color: var(--text-muted); }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 15px 0 5px 5px;
        }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; margin-left: 5px; }
        input {
            width: 100%;
            padding: 12px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
        }
        input::placeholder { color: #555; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .metric-box {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 5px;
            text-align: center;
        }
        .metric-box label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .metric-box .val { font-size: 18px; font-weight: bold; }
        .val-green { color: var(--accent-green); }
        .val-blue { color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-start { background-color: var(--accent-green); margin-top: 10px; }
        .btn-action { background-color: var(--accent-orange); }
        .btn-stop { background-color: var(--accent-red); margin-top: 5px; }
        .btn-csv { background-color: #0277bd; }
        .btn-json { background-color: var(--accent-purple); }
        .btn-clear { background-color: #424242; color: #ccc; }

        .log-box {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            height: 100px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .log-time { color: var(--text-main); font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kierowca App Pro</h2>
    
    <div class="status-card">
        <div class="state">Stan: <span id="appStatus">Stop</span></div>
        <div class="gps" id="gpsStatus">GPS: Gotowy</div>
    </div>

    <div class="section-title">TRASA</div>
    <div class="input-group">
        <label>Skąd (Załadunek / Start):</label>
        <input type="text" id="startPlace" placeholder="np. Poznań">
    </div>
    <div class="input-group">
        <label>Dokąd (Rozładunek / Cel):</label>
        <input type="text" id="endPlace" placeholder="np. Berlin">
    </div>

    <div class="section-title">LICZNIK KILOMETRÓW</div>
    <div class="grid-2">
        <div class="input-group">
            <label>Początkowy (km):</label>
            <input type="number" id="startOdo" placeholder="np. 150000">
        </div>
        <div class="input-group">
            <label>Końcowy (km):</label>
            <input type="number" id="endOdo" placeholder="np. 150350">
        </div>
    </div>

    <div class="grid-2">
        <div class="metric-box">
            <label>km z licznika</label>
            <div class="val val-green" id="calcKm">0.00 km</div>
        </div>
        <div class="metric-box">
            <label>km z GPS</label>
            <div class="val val-blue" id="gpsKm">0.00 km</div>
        </div>
        <div class="metric-box">
            <label>Prędkość GPS</label>
            <div class="val val-green" id="gpsSpeed">0 km/h</div>
        </div>
        <div class="metric-box">
            <label>Czas jazdy</label>
            <div class="val val-green" id="driveTime">0:00</div>
        </div>
        <div class="metric-box">
            <label>Ciągła jazda</label>
            <div class="val val-green" id="continuousTime">0:00</div>
        </div>
        <div class="metric-box">
            <label>Dzienny czas jazdy</label>
            <div class="val val-green" id="dailyTime">0:00</div>
        </div>
    </div>

    <button class="btn btn-start" id="mainBtn" onclick="toggleRoute()">Start Trasy</button>

    <div class="grid-2">
        <button class="btn btn-action" onclick="logEvent('Tankowanie')">Tankowanie</button>
        <button class="btn btn-action" onclick="logEvent('Załadunek')">Załadunek</button>
        <button class="btn btn-action" onclick="logEvent('Rozładunek')">Rozładunek</button>
        <button class="btn btn-action" onclick="logEvent('Pauza')">Pauza</button>
    </div>

    <button class="btn btn-stop" onclick="finishWork()">Zakończ Pracę</button>

    <div class="section-title">DZIENNIK ZDARZEŃ</div>
    <div class="log-box" id="logContent">Brak zdarzeń</div>

    <button class="btn btn-csv" onclick="shareReport()">Generuj i wyślij raport</button>
    <button class="btn btn-json" onclick="downloadJSON()">Zapisz kopię zapasową (JSON)</button>
    <button class="btn btn-clear" onclick="clearData()">Wyczyść historię i dane</button>
</div>

<script>
    let isRunning = false;
    let watchId = null;
    let totalGpsDistance = 0;
    let lastPosition = null;
    let startTime = null;
    let timerInterval = null;
    let events = [];

    document.getElementById('startOdo').addEventListener('input', calculateOdo);
    document.getElementById('endOdo').addEventListener('input', calculateOdo);
    document.getElementById('startPlace').addEventListener('input', saveData);
    document.getElementById('endPlace').addEventListener('input', saveData);

    function calculateOdo() {
        const start = parseFloat(document.getElementById('startOdo').value) || 0;
        const end = parseFloat(document.getElementById('endOdo').value) || 0;
        const calcBox = document.getElementById('calcKm');
        if (end > start) {
            calcBox.textContent = (end - start).toFixed(2) + " km";
        } else {
            calcBox.textContent = "0.00 km";
        }
        saveData();
    }

    function toggleRoute() {
        isRunning = !isRunning;
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('appStatus');
        
        if (isRunning) {
            btn.textContent = "Zatrzymaj Trasę";
            btn.style.backgroundColor = "#d32f2f";
            status.textContent = "W trasie";
            status.style.color = "#4caf50";
            startTime = Date.now();
            timerInterval = setInterval(updateTimers, 1000);
            startGPS();
            logEvent("Start trasy");
        } else {
            btn.textContent = "Start Trasy";
            btn.style.backgroundColor = "#4caf50";
            status.textContent = "Stop";
            status.style.color = "#ff9800";
            clearInterval(timerInterval);
            stopGPS();
            logEvent("Koniec trasy");
        }
        saveData();
    }

    function updateTimers() {
        if(!startTime) return;
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const hrs = Math.floor(diff / 3600);
        const mins = Math.floor((diff % 3600) / 60);
        const timeStr = `${hrs}:${mins.toString().padStart(2, '0')}`;
        document.getElementById('driveTime').textContent = timeStr;
        document.getElementById('continuousTime').textContent = timeStr;
        document.getElementById('dailyTime').textContent = timeStr;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const f1 = lat1 * Math.PI/180;
        const f2 = lat2 * Math.PI/180;
        const df = (lat2-lat1) * Math.PI/180;
        const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(df/2) * Math.sin(df/2) +
                  Math.cos(f1) * Math.cos(f2) *
                  Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function startGPS() {
        if ("geolocation" in navigator) {
            document.getElementById('gpsStatus').textContent = "GPS: Aktywny";
            watchId = navigator.geolocation.watchPosition(position => {
                const speedMs = position.coords.speed;
                const speedKmh = speedMs ? (speedMs * 3.6).toFixed(0) : 0;
                document.getElementById('gpsSpeed').textContent = speedKmh + " km/h";

                if (lastPosition && speedKmh > 2 && position.coords.accuracy < 50) {
                    const dist = calculateDistance(
                        lastPosition.coords.latitude, lastPosition.coords.longitude,
                        position.coords.latitude, position.coords.longitude
                    );
                    if(dist < 500) {
                        totalGpsDistance += (dist / 1000);
                        document.getElementById('gpsKm').textContent = totalGpsDistance.toFixed(2) + " km";
                    }
                }
                lastPosition = position;
            }, error => {
                document.getElementById('gpsStatus').textContent = "GPS: Błąd/Brak sygnału";
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }
    }

    function stopGPS() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        document.getElementById('gpsSpeed').textContent = "0 km/h";
        document.getElementById('gpsStatus').textContent = "GPS: Gotowy";
        lastPosition = null;
    }

    function logEvent(type) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const logContent = document.getElementById('logContent');
        if (events.length === 0) logContent.innerHTML = '';
        
        const entry = `<div class="log-entry"><span class="log-time">[${time}]</span> ${type}</div>`;
        logContent.innerHTML += entry;
        logContent.scrollTop = logContent.scrollHeight;
        
        events.push({ time, type });
        saveData();
    }

    function finishWork() {
        if (isRunning) toggleRoute();
        logEvent("Zakończenie pracy");
        shareReport();
    }

    // Nowoczesne udostępnianie raportu bezpośrednio w systemie telefonów (Android/iOS)
    async function shareReport() {
        const startPlace = document.getElementById('startPlace').value || "Brak";
        const endPlace = document.getElementById('endPlace').value || "Brak";
        const startOdo = document.getElementById('startOdo').value || "0";
        const endOdo = document.getElementById('endOdo').value || "0";
        const gpsKm = totalGpsDistance.toFixed(2);
        const calcKm = document.getElementById('calcKm').textContent;

        let reportText = `🚚 RAPORT Z TRASY - KIEROWCA APP\n`;
        reportText += `--------------------------------\n`;
        reportText += `📍 Skąd: ${startPlace}\n`;
        reportText += `🏁 Dokąd: ${endPlace}\n`;
        reportText += `🔢 Start licznik: ${startOdo} km\n`;
        reportText += `🔢 Koniec licznik: ${endOdo} km\n`;
        reportText += `📏 Dystans z licznika: ${calcKm}\n`;
        reportText += `🛰️ Dystans z GPS: ${gpsKm} km\n\n`;
        reportText += `⏱️ ZDARZENIA:\n`;

        if (events.length === 0) {
            reportText += `Brak zdarzeń\n`;
        } else {
            events.forEach(e => {
                reportText += `[${e.time}] ${e.type}\n`;
            });
        }

        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Raport z trasy',
                    text: reportText
                });
            } catch (err) {
                console.log('Anulowano udostępnianie');
            }
        } else {
            // Awaryjnie do schowka, gdyby przeglądarka nie obsługiwała share
            navigator.clipboard.writeText(reportText).then(() => {
                alert("Skopiowano raport do schowka!");
            });
        }
    }

    function downloadJSON() {
        const data = {
            startPlace: document.getElementById('startPlace').value,
            endPlace: document.getElementById('endPlace').value,
            startOdo: document.getElementById('startOdo').value,
            endOdo: document.getElementById('endOdo').value,
            gpsKm: totalGpsDistance,
            events: events,
            exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kopia_zapasowa_${Date.now()}.json`;
        a.click();
    }

    function saveData() {
        const data = {
            startOdo: document.getElementById('startOdo').value,
            endOdo: document.getElementById('endOdo').value,
            startPlace: document.getElementById('startPlace').value,
            endPlace: document.getElementById('endPlace').value,
            gpsKm: totalGpsDistance,
            events: events
        };
        localStorage.setItem('kierowcaData', JSON.stringify(data));
    }

    function loadData() {
        const saved = JSON.parse(localStorage.getItem('kierowcaData'));
        if (saved) {
            if(saved.startOdo) document.getElementById('startOdo').value = saved.startOdo;
            if(saved.endOdo) document.getElementById('endOdo').value = saved.endOdo;
            if(saved.startPlace) document.getElementById('startPlace').value = saved.startPlace;
            if(saved.endPlace) document.getElementById('endPlace').value = saved.endPlace;
            
            totalGpsDistance = saved.gpsKm || 0;
            document.getElementById('gpsKm').textContent = totalGpsDistance.toFixed(2) + " km";
            calculateOdo();

            if (saved.events && saved.events.length > 0) {
                events = saved.events;
                const logContent = document.getElementById('logContent');
                logContent.innerHTML = '';
                events.forEach(e => {
                    logContent.innerHTML += `<div class="log-entry"><span class="log-time">[${e.time}]</span> ${e.type}</div>`;
                });
                logContent.scrollTop = logContent.scrollHeight;
            }
        }
    }

    function clearData() {
        if(confirm("Na pewno wyczyścić całą historię?")) {
            localStorage.removeItem('kierowcaData');
            location.reload();
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
