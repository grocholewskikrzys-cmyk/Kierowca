<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestrator Pracy Kierowcy Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
        }
        .status-box {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 3px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4caf50;
            margin-top: 5px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }
        .btn-start { background-color: #2e7d32; grid-column: span 2; }
        .btn-action { background-color: #f57c00; }
        .btn-manual-resume { background-color: #1976d2; grid-column: span 2; display: none; }
        .btn-stop { background-color: #c62828; grid-column: span 2; }
        
        #gps-status {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        #log {
            margin-top: 15px;
            background: #121212;
            padding: 10px;
            border-radius: 6px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 13px;
            border: 1px solid #333;
        }
        .btn-csv {
            background-color: #0277bd;
            font-size: 14px;
            padding: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-clear {
            background-color: #424242;
            font-size: 12px;
            padding: 6px;
            margin-top: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kierowca App Pro</h2>
    
    <div class="status-box">
        Stan: <span id="currentStatus" style="font-weight: bold; color: #ffb74d;">Stop</span>
        <div id="gps-status">GPS: Gotowy</div>
    </div>

    <div class="input-group">
        <label>Skąd (Załadunek / Punkt początkowy):</label>
        <input type="text" id="routeFrom" placeholder="np. Poznań">
    </div>
    <div class="input-group">
        <label>Dokąd (Rozładunek / Punkt docelowy):</label>
        <input type="text" id="routeTo" placeholder="np. Berlin">
    </div>

    <div class="stats-grid">
        <div class="input-group" style="margin-bottom:0;">
            <label>Liczn. Początkowy (km):</label>
            <input type="number" id="odometerStart" placeholder="np. 150000" oninput="calculateOdometer()">
        </div>
        <div class="input-group" style="margin-bottom:0;">
            <label>Liczn. Końcowy (km):</label>
            <input type="number" id="odometerEnd" placeholder="np. 150350" oninput="calculateOdometer()">
        </div>
    </div>

    <div class="stats-grid" style="margin-top: 10px;">
        <div class="stat-card">
            <div>Przejechane km (z licznika)</div>
            <div class="stat-value" id="totalDistance">0.00 km</div>
        </div>
        <div class="stat-card">
            <div>Prędkość (GPS)</div>
            <div class="stat-value" id="currentSpeed">0 km/h</div>
        </div>
    </div>

    <div class="btn-grid">
        <button class="btn-start" onclick="startRoute()">Start Trasy</button>
        
        <button class="btn-action" onclick="setActivity('Tankowanie')">Tankowanie</button>
        <button class="btn-action" onclick="setActivity('Załadunek')">Załadunek</button>
        <button class="btn-action" onclick="setActivity('Rozładunek')">Rozładunek</button>
        <button class="btn-action" onclick="setActivity('Pauza')">Pauza</button>
        
        <button id="manualResume" class="btn-manual-resume" onclick="setActivity('Trasa (Wznowiona ręcznie)')">Wróć do Trasy ręcznie</button>
    </div>

    <button class="btn-stop" onclick="stopWork()">Zakończ Pracę</button>

    <h3>Dziennik zdarzeń i trasa:</h3>
    <div id="log"></div>
    
    <button class="button btn-csv" onclick="exportToCSV()">Pobierz raport CSV</button>
    <button class="button btn-clear" onclick="clearData()">Wyczyść historię i dane</button>
</div>
