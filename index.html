<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewidencja Czasu i Tras Kierowcy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        h1 { font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 25px; margin-bottom: 12px; }

        /* Formularz układ */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.save-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        button.save-btn:hover { background-color: #219653; }

        /* Kafelki podsumowania */
        .summary-container {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }
        .summary-tile {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 12px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .summary-title {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .summary-value {
            font-size: 22px;
            font-weight: bold;
            color: #212529;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            font-size: 13px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover { background-color: #f8f9fa; }

        .actions-cell {
            text-align: right;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .delete-btn:hover { background: #c0392b; }

        /* Przycisk drukowania */
        .print-container {
            text-align: center;
            margin-top: 20px;
        }
        button.print-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button.print-btn:hover { background-color: #2980b9; }

        /* Styl do wydruku */
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            form, .delete-btn, .print-container { display: none; }
            .summary-tile { background-color: #f8f9fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th { background-color: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ewidencja Czasu i Tras Kierowcy</h1>

    <!-- Formularz do wpisywania -->
    <form id="entry-form">
        <!-- 1. Opis trasy na samej górze (szeroki) -->
        <div class="form-group full-width">
            <label for="trasa">Trasa / Opis:</label>
            <input type="text" id="trasa" placeholder="np. Kontener Poznań - Berlin" required>
        </div>

        <div class="form-grid">
            <!-- 2. Godzina od i do obok siebie -->
            <div class="form-group">
                <label for="godzina_od">Godzina od:</label>
                <input type="time" id="godzina_od" required>
            </div>
            <div class="form-group">
                <label for="godzina_do">Godzina do:</label>
                <input type="time" id="godzina_do" required>
            </div>

            <!-- 3. Data i Kilometry na dole obok siebie -->
            <div class="form-group">
                <label for="data">Data startu:</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group">
                <label for="km">Kilometry (km):</label>
                <input type="number" id="km" placeholder="450" required>
            </div>
        </div>

        <button type="submit" class="save-btn">Zapisz dzień</button>
    </form>

    <h2>Podsumowanie Miesiąca</h2>

    <!-- Kafelki -->
    <div class="summary-container">
        <div class="summary-tile">
            <div class="summary-title">Łączny dystans</div>
            <div id="total-km" class="summary-value">0 km</div>
        </div>
        <div class="summary-tile">
            <div class="summary-title">Czas w trasie</div>
            <div id="total-time" class="summary-value">0h 0m</div>
        </div>
    </div>

    <h2>Rejestr Dzień po Dniu</h2>

    <!-- Tabela -->
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Trasa / Opis</th>
                <th>Godziny</th>
                <th>Km</th>
                <th>Czas</th>
                <th class="actions-cell">Opcje</th>
            </tr>
        </thead>
        <tbody id="entries-table-body">
            <!-- Tutaj wskakują wpisy -->
        </tbody>
    </table>

    <!-- Przycisk drukowania -->
    <div class="print-container">
        <button onclick="window.print()" class="print-btn">Drukuj / Zapisz raport PDF</button>
    </div>
</div>

<script>
    // Ustawienie domyślnych wartości
    document.getElementById('data').valueAsDate = new Date();
    document.getElementById('godzina_od').value = "21:00";
    document.getElementById('godzina_do').value = "05:00";

    function calculateMinutes(start, end) {
        if (!start || !end) return 0;
        const [h1, m1] = start.split(':').map(Number);
        const [h2, m2] = end.split(':').map(Number);
        
        let startMins = h1 * 60 + m1;
        let endMins = h2 * 60 + m2;

        if (endMins < startMins) {
            endMins += 24 * 60;
        }
        return endMins - startMins;
    }

    function renderApp() {
        const entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        const tableBody = document.getElementById('entries-table-body');
        tableBody.innerHTML = '';

        let totalKm = 0;
        let totalMinutes = 0;

        if (entries.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #6c757d;">Brak wpisów. Dodaj pierwszy dzień powyżej.</td></tr>';
            document.getElementById('total-km').innerText = '0 km';
            document.getElementById('total-time').innerText = '0h 0m';
            return;
        }

        entries.forEach((entry, index) => {
            const km = parseFloat(entry.km) || 0;
            const godzOd = entry.godzina_od || '00:00';
            const godzDo = entry.godzina_do || '00:00';

            totalKm += km;

            const shiftMinutes = calculateMinutes(godzOd, godzDo);
            totalMinutes += shiftMinutes;

            const shiftHoursFormatted = `${Math.floor(shiftMinutes / 60)}h ${shiftMinutes % 60}m`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${entry.data || '-'}</td>
                <td>${entry.trasa || '-'}</td>
                <td>${godzOd}-${godzDo}</td>
                <td>${km.toLocaleString('pl-PL')}</td>
                <td>${shiftHoursFormatted}</td>
                <td class="actions-cell"><button class="delete-btn" onclick="deleteEntry(${index})">Usuń</button></td>
            `;
            tableBody.appendChild(row);
        });

        const totalHoursFinal = Math.floor(totalMinutes / 60);
        const totalMinutesFinal = totalMinutes % 60;

        document.getElementById('total-km').innerText = totalKm.toLocaleString('pl-PL') + ' km';
        document.getElementById('total-time').innerText = `${totalHoursFinal}h ${totalMinutesFinal}m`;
    }

    document.getElementById('entry-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const newEntry = {
            data: document.getElementById('data').value,
            trasa: document.getElementById('trasa').value,
            km: document.getElementById('km').value,
            godzina_od: document.getElementById('godzina_od').value,
            godzina_do: document.getElementById('godzina_do').value
        };

        let entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        entries.push(newEntry);
        localStorage.setItem('driver_entries', JSON.stringify(entries));

        // Czyszczenie pola trasy i km (data i godziny zostają dla wygody)
        document.getElementById('trasa').value = '';
        document.getElementById('km').value = '';

        renderApp();
    });

    function deleteEntry(index) {
        let entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        entries.splice(index, 1);
        localStorage.setItem('driver_entries', JSON.stringify(entries));
        renderApp();
    }

    renderApp();
</script>

</body>
</html>
