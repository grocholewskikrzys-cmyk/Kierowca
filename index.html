<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Kierowca App Pro 2.0</title>
<style>
:root{
  --bg:#101214;--card:#1b1e21;--card2:#24282c;--border:#34393e;
  --text:#f4f4f4;--muted:#9aa0a6;--green:#35b85a;--orange:#f39a22;
  --blue:#2589e8;--red:#e54848;--purple:#9b59d0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:10px}
.container{width:100%;max-width:560px;margin:auto}
h2{text-align:center;margin:8px 0 16px;font-size:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px}
.status{text-align:center}
.state{font-size:17px;font-weight:700}
.state span{color:var(--orange)}
.gps{font-size:12px;color:var(--muted);margin-top:5px}
.section{font-size:11px;letter-spacing:1px;color:var(--muted);margin:15px 3px 6px}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 4px 3px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px;text-align:center;min-height:65px}
  .metric small{display:block;color:var(--muted);font-size:11px}
</style>
<script>
function readForm(){
  return {
    startPlace:$('startPlace').value.trim(),
    endPlace:$('endPlace').value.trim(),
    startOdo:$('startOdo').value,
    endOdo:$('endOdo').value
  };
}

function odoKm(){
  const a=parseFloat($('startOdo').value);
  const b=parseFloat($('endOdo').value);
  return Number.isFinite(a)&&Number.isFinite(b)&&b>=a ? b-a : 0;
}

function updateOdo(){
  const km=odoKm();
  $('calcKm').textContent=km.toFixed(2)+' km';
  const diff=km-(session?.gpsKm||0);
  $('difference').textContent=(Number.isFinite(diff)?diff:0).toFixed(2)+' km';
}

['startOdo','endOdo'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    updateOdo();
    persistActive();
  });
});

function newSession(){
  const f=readForm();

  return {
    id:uid(),
    active:true,
    startAt:now(),
    endAt:null,

    startPlace:f.startPlace,
    endPlace:f.endPlace,
    startOdo:f.startOdo,
    endOdo:f.endOdo,

    gpsKm:0,
    driveMs:0,
    workMs:0,
    continuousMs:0,

    state:'W trasie',
    activity:null,
    activityStart:null,

    stateStartedAt:now(),
    lastDriveStart:now(),
    continuousStart:now(),

    events:[],
    gpsSamples:0,
    lastGpsAt:null,
    lastSpeed:0
  };
}

function addEvent(type,extra={}){
  if(!session)return;

  session.events.push({
    type,
    at:now(),
    ...extra
  });

  renderLog();
  persistActive();
}

function renderLog(){
  const box=$('log');

  if(!session || !session.events || !session.events.length){
    box.innerHTML='<div class="small">Brak zdarzeń</div>';
    return;
  }

  box.innerHTML=session.events.map(e=>{
    let text=e.type;

    if(e.duration!=null){
      return `<div class="entry">
        <b>${timeOnly(e.at)}</b>${text}
        <span class="dur">${fmt(e.duration/1000)}</span>
      </div>`;
    }

    return `<div class="entry"><b>${timeOnly(e.at)}</b>${text}</div>`;
  }).join('');
}

function currentStateMs(){
  if(!session || !session.stateStartedAt)return 0;
  return Math.max(0,now()-session.stateStartedAt);
}

function commitStateTime(){
  if(!session)return;

  const elapsed=currentStateMs();

  if(session.state==='W trasie'){
    session.driveMs+=elapsed;
    session.workMs+=elapsed;
    session.continuousMs+=elapsed;
  }else{
    session.workMs+=elapsed;
  }

  session.stateStartedAt=now();
}

function commitContinuous(){
  if(!session || !session.continuousStart)return;

  session.continuousMs=Math.max(
    session.continuousMs,
    now()-session.continuousStart
  );
}

  if(!navigator.geolocation){
    $('gpsStatus').textContent='GPS: brak obsługi';
    return;
  }

  if(watchId!==null)return;

  $('gpsStatus').textContent='GPS: oczekiwanie...';

  watchId=navigator.geolocation.watchPosition(
    handlePosition,
    handleGPSError,
    {
      enableHighAccuracy:true,
      maximumAge:2000,
      timeout:10000
    }
  );
}

function stopGPS(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }

  $('gpsStatus').textContent='GPS: wyłączony';
  lastPosition=null;
  movingSamples=0;
  stationarySamples=0;
}

}

    watchId=null;
  }

function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000;
  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;
  const dp=(lat2-lat1)*Math.PI/180;
  const dl=(lon2-lon1)*Math.PI/180;

  const a=
    Math.sin(dp/2)**2+
    Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;

  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function handlePosition(pos){
  if(!session || !session.active)return;

  const c=pos.coords;
  const accuracy=Number(c.accuracy)||999;

  if(accuracy>60){
    $('gpsStatus').textContent=
      'GPS: słaba dokładność ('+Math.round(accuracy)+' m)';
    return;
  }

  const lat=c.latitude;
  const lon=c.longitude;

  let speed=Number.isFinite(c.speed)&&c.speed!==null
    ? Math.max(0,c.speed*3.6)
    : 0;

  if(lastPosition){
    const d=distanceMeters(
      lastPosition.lat,
      lastPosition.lon,
      lat,
      lon
    );

    const dt=(pos.timestamp-lastPosition.time)/1000;

    if(dt>0){
      const calculatedSpeed=d/dt*3.6;

      if(speed<1){
        speed=calculatedSpeed;
      }

      /*
       * Odrzucamy duże skoki GPS.
       * Przy normalnej jeździe ciężarówką 250 km/h
       * traktujemy jako nierealny wynik.
       */
      if(
        d>=5 &&
        d<1000 &&
        calculatedSpeed<250
      ){
        session.gpsKm+=d/1000;
      }
    }
  }

  lastPosition={
    lat,
    lon,
    time:pos.timestamp
  };

  session.gpsSamples++;
  session.lastGpsAt=pos.timestamp;
  session.lastSpeed=speed;

  $('gpsSpeed').textContent=Math.round(speed)+' km/h';
  $('gpsKm').textContent=session.gpsKm.toFixed(2)+' km';

  updateOdo();

  $('gpsStatus').textContent=
    'GPS: OK ±'+Math.round(accuracy)+' m';

  /*
   * Automatyczny powrót do jazdy.
   *
   * Normalna czynność:
   * 3 kolejne próbki z prędkością >= 8 km/h.
   *
   * Pauza:
   * 4 kolejne próbki z prędkością >= 8 km/h.
   */
  if(session.state!=='W trasie'){
    if(speed>=8){
      movingSamples++;
      stationarySamples=0;
    }else{
      movingSamples=0;
      stationarySamples++;
    }

    const required=session.state==='Pauza'?4:3;

    if(movingSamples>=required){
      resumeDriving();
    }
  }else{
    if(speed<3){
      stationarySamples++;
    }else{
      stationarySamples=0;
    }
  }

  persistActive();
}

function handleGPSError(err){
  let text='GPS: błąd';

  if(err){
    if(err.code===1)text='GPS: brak zgody na lokalizację';
    if(err.code===2)text='GPS: pozycja niedostępna';
    if(err.code===3)text='GPS: przekroczony czas oczekiwania';
  }

  $('gpsStatus').textContent=text;
}

async function loadActiveSession(){
  const all=await txAll();

  const active=all
    .filter(x=>x.active===true)
    .sort((a,b)=>(b.startAt||0)-(a.startAt||0))[0];

  if(!active)return;

  session=active;

  if(!session.stateStartedAt){
    session.stateStartedAt=now();
  }

  $('startPlace').value=session.startPlace||'';
  $('endPlace').value=session.endPlace||'';
  $('startOdo').value=session.startOdo||'';
  $('endOdo').value=session.endOdo||'';

  renderLog();
  updateOdo();
  updateUI();

  $('resumeBanner').classList.remove('hidden');
}

function resumeSession(){
  if(!session)return;

  $('resumeBanner').classList.add('hidden');

  session.active=true;

  if(session.state==='Stop' || session.state==='Zakończona'){
    session.state='W trasie';
  }

  session.stateStartedAt=now();

  startGPS();
  startTimer();

  updateUI();
  persistActive();
}

function buildReport(s){
  if(!s)return '';

  const odoStart=parseFloat(s.startOdo);
  const odoEnd=parseFloat(s.endOdo);

  const odoKmValue=
    Number.isFinite(odoStart)&&Number.isFinite(odoEnd)
      ? odoEnd-odoStart
      : 0;

  let totalWork=s.workMs||0;
  let totalDrive=s.driveMs||0;

  if(s.active){
    const elapsed=currentStateMs();

    if(s.state==='W trasie'){
      totalDrive+=elapsed;
      totalWork+=elapsed;
    }else{
      totalWork+=elapsed;
    }
  }

  const diff=odoKmValue-(s.gpsKm||0);

  let txt='KIEROWCA APP PRO 2.0\n';
  txt+='====================\n';
  txt+='Data rozpoczęcia: '+dateTime(s.startAt)+'\n';

  if(s.endAt){
    txt+='Data zakończenia: '+dateTime(s.endAt)+'\n';
  }

  txt+='\nTRASA\n';
  txt+='Skąd: '+(s.startPlace||'-')+'\n';
  txt+='Dokąd: '+(s.endPlace||'-')+'\n';

  txt+='\nPRZEBIEG\n';
  txt+='Licznik początkowy: '+(s.startOdo||'-')+' km\n';
  txt+='Licznik końcowy: '+(s.endOdo||'-')+' km\n';
  txt+='Kilometry z licznika: '+odoKmValue.toFixed(2)+' km\n';
  txt+='Kilometry GPS: '+(s.gpsKm||0).toFixed(2)+' km\n';
  txt+='Różnica: '+diff.toFixed(2)+' km\n';

  txt+='\nCZASY\n';
  txt+='Czas jazdy: '+fmt(totalDrive/1000)+'\n';
  txt+='Czas pracy: '+fmt(totalWork/1000)+'\n';

  txt+='\nZDARZENIA\n';

  if(s.events && s.events.length){
    s.events.forEach(e=>{
      txt+=timeOnly(e.at)+' - '+e.type;

      if(e.duration!=null){
        txt+=' ('+fmt(e.duration/1000)+')';
      }

      txt+='\n';
    });
  }else{
    txt+='Brak\n';
  }

  return txt;
}

async function shareReport(){
  if(!session){
    alert('Brak trasy do raportu.');
    return;
  }

  const report=buildReport(session);

  if(navigator.share){
    try{
      await navigator.share({
        title:'Kierowca App Pro',
        text:report
      });
    }catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(report);
      alert('Raport skopiowany do schowka.');
    }catch(e){
      prompt('Skopiuj raport:',report);
    }
  }
}

async function exportBackup(){
  const all=await txAll();

  const data={
    app:'Kierowca App Pro',
    version:'2.0',
    exportedAt:new Date().toISOString(),
    trips:all
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.href=url;
  a.download=
    'kierowca-backup-'+
    new Date().toISOString().slice(0,10)+
    '.json';

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackup(){
  const input=document.createElement('input');

  input.type='file';
  input.accept='.json,application/json';

  input.onchange=async()=>{
    const file=input.files[0];

    if(!file)return;

    try{
      const text=await file.text();
      const data=JSON.parse(text);

      if(!data || !Array.isArray(data.trips)){
        throw new Error('Nieprawidłowa kopia');
      }

      if(!confirm(
        'Wczytać kopię? Istniejące dane o tych samych ID zostaną zastąpione.'
      ))return;

      for(const trip of data.trips){
        if(trip && trip.id){
          await txPut(trip);
        }
      }

      alert('Kopia została wczytana.');

      location.reload();

    }catch(e){
      alert('Nie udało się wczytać kopii.');
      console.error(e);
    }
  };

  input.click();
}

async function openHistory(){
  const all=await txAll();

  all.sort((a,b)=>
    (b.startAt||0)-(a.startAt||0)
  );

  const list=$('historyList');

  if(!all.length){
    list.innerHTML='<div class="small">Brak zapisanych tras.</div>';
  }else{
    list.innerHTML=all.map(s=>{
      const start=s.startPlace||'-';
      const end=s.endPlace||'-';

      const a=parseFloat(s.startOdo);
      const b=parseFloat(s.endOdo);

      const km=
        Number.isFinite(a)&&Number.isFinite(b)
          ? (b-a).toFixed(1)
          : '0.0';

      return `
        <div class="history-item">
          <b>${dateTime(s.startAt)}</b>
          <div>${start} → ${end}</div>
          <div>Przebieg: ${km} km</div>
          <div>GPS: ${(s.gpsKm||0).toFixed(1)} km</div>
          <div>Jazda: ${fmt((s.driveMs||0)/1000)}</div>
        </div>
      `;
    }).join('');
  }

  $('historyDialog').showModal();
}async function clearAll(){
  if(!confirm(
    'UWAGA!\n\nZostaną usunięte wszystkie zapisane trasy i historia.\n\nCzy na pewno chcesz kontynuować?'
  ))return;

  await txClear();

  session=null;
  stopGPS();
  stopTimer();

  $('resumeBanner').classList.add('hidden');

  $('startPlace').value='';
  $('endPlace').value='';
  $('startOdo').value='';
  $('endOdo').value='';

  $('gpsKm').textContent='0.00 km';
  $('gpsSpeed').textContent='0 km/h';
  $('difference').textContent='0.00 km';

  $('log').innerHTML=
    '<div class="small">Brak zdarzeń</div>';

  updateUI();

  alert('Wszystkie dane zostały usunięte.');
}

window.addEventListener('beforeunload',()=>{
  if(session && session.active){
    persistActive();
  }
});

async function init(){
  try{
    await openDB();
    await loadActiveSession();

    if(!session){
      updateUI();
    }

    startTimer();

  }catch(e){
    console.error(e);
    alert('Nie udało się uruchomić bazy danych aplikacji.');
  }
}

init();
</script>
