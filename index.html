<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewidencja Czasu i Tras Kierowcy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 20px; margin-top: 30px; margin-bottom: 15px; }

        /* Formularz */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.save-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button.save-btn:hover { background-color: #219653; }

        /* Kafelki podsumowania */
        .summary-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        .summary-tile {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .summary-title {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .summary-value {
            font-size: 24px;
            font-weight: bold;
            color: #212529;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover { background-color: #f8f9fa; }

        .actions-cell {
            text-align: right;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { background: #c0392b; }

        /* Przycisk drukowania */
        .print-container {
            text-align: center;
            margin-top: 25px;
        }
        button.print-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button.print-btn:hover { background-color: #2980b9; }

        /* Styl do wydruku */
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            form, .delete-btn, .print-container { display: none; }
            .summary-tile { background-color: #f8f9fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th { background-color: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ewidencja Czasu i Tras Kierowcy</h1>

    <!-- Formularz do wpisywania -->
    <form id="entry-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="data">Data:</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group">
                <label for="trasa">Trasa / Opis:</label>
                <input type="text" id="trasa" placeholder="np. Poznań - Berlin" required>
            </div>
            <div class="form-group">
                <label for="km">Kilometry (km):</label>
                <input type="number" id="km" placeholder="450" required>
            </div>
            <div class="form-group">
                <label for="czas">Czas (np. 08:30):</label>
                <input type="text" id="czas" placeholder="08:30" required>
            </div>
        </div>
        <button type="submit" class="save-btn">Zapisz dzień</button>
    </form>

    <h2>Podsumowanie Miesiąca</h2>

    <!-- Kafelki -->
    <div class="summary-container">
        <div class="summary-tile">
            <div class="summary-title">Łączny dystans</div>
            <div id="total-km" class="summary-value">0 km</div>
        </div>
        <div class="summary-tile">
            <div class="summary-title">Czas w trasie</div>
            <div id="total-time" class="summary-value">0h 0m</div>
        </div>
    </div>

    <h2>Rejestr Dzień po Dniu</h2>

    <!-- Tabela -->
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Trasa / Opis</th>
                <th>Kilometry</th>
                <th>Czas</th>
                <th class="actions-cell">Opcje</th>
            </tr>
        </thead>
        <tbody id="entries-table-body">
            <!-- Tutaj wskakują wpisy -->
        </tbody>
    </table>

    <!-- Przycisk drukowania -->
    <div class="print-container">
        <button onclick="window.print()" class="print-btn">Drukuj / Zapisz raport PDF</button>
    </div>
</div>

<script>
    // Ustawienie dzisiejszej daty domyślnie w formularzu
    document.getElementById('data').valueAsDate = new Date();

    // Funkcja ładująca dane i licząca podsumowanie
    function renderApp() {
        const entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        const tableBody = document.getElementById('entries-table-body');
        tableBody.innerHTML = '';

        let totalKm = 0;
        let totalMinutes = 0;

        if (entries.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #6c757d;">Brak wpisów. Dodaj pierwszy dzień powyżej.</td></tr>';
            document.getElementById('total-km').innerText = '0 km';
            document.getElementById('total-time').innerText = '0h 0m';
            return;
        }

        // Sortowanie po dacie (opcjonalnie, żeby najnowsze/najstarsze były poukładane)
        entries.forEach((entry, index) => {
            const km = parseFloat(entry.km) || 0;
            const czasStr = entry.czas || '00:00';

            totalKm += km;

            const parts = czasStr.split(':');
            if (parts.length === 2) {
                totalMinutes += parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${entry.data || '-'}</td>
                <td>${entry.trasa || '-'}</td>
                <td>${km.toLocaleString('pl-PL')} km</td>
                <td>${czasStr}</td>
                <td class="actions-cell"><button class="delete-btn" onclick="deleteEntry(${index})">Usuń</button></td>
            `;
            tableBody.appendChild(row);
        });

        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        document.getElementById('total-km').innerText = totalKm.toLocaleString('pl-PL') + ' km';
        document.getElementById('total-time').innerText = `${hours}h ${minutes}m`;
    }

    // Obsługa formularza (zapisywanie)
    document.getElementById('entry-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const newEntry = {
            data: document.getElementById('data').value,
            trasa: document.getElementById('trasa').value,
            km: document.getElementById('km').value,
            czas: document.getElementById('czas').value
        };

        let entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        entries.push(newEntry);
        localStorage.setItem('driver_entries', JSON.stringify(entries));

        // Czyszczenie pól trasy, km i czasu (data zostaje lub aktualizuje się)
        document.getElementById('trasa').value = '';
        document.getElementById('km').value = '';
        document.getElementById('czas').value = '';

        renderApp();
    });

    // Funkcja do usuwania pojedynczego wpisu (gdyby się pomylił)
    function deleteEntry(index) {
        let entries = JSON.parse(localStorage.getItem('driver_entries')) || [];
        entries.splice(index, 1);
        localStorage.setItem('driver_entries', JSON.stringify(entries));
        renderApp();
    }

    // Uruchomienie przy starcie
    renderApp();
</script>

</body>
</html>
