<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kierowca App Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 15px; color: #ffffff; }
        .status-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .status-box span { font-weight: bold; color: #ffa726; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; color: #b0b0b0; }
        input {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
        }
        .metric-box .val { font-size: 18px; font-weight: bold; color: #66bb6a; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            color: white;
        }
        .btn-start { background-color: #388e3c; }
        .btn-action { background-color: #f57c00; }
        .btn-stop { background-color: #d32f2f; }
        .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .log-section { margin-top: 15px; font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kierowca App Pro</h2>
    
    <div class="status-box">
        Stan: <span id="appStatus">Stop</span><br>
        <small id="gpsStatus">GPS: Oczekiwanie...</small>
    </div>

    <div class="input-group">
        <label>Skąd (Załadunek / Punkt początkowy):</label>
        <input type="text" id="startPlace" placeholder="np. Poznań">
    </div>

    <div class="input-group">
        <label>Dokąd (Rozładunek / Punkt docelowy):</label>
        <input type="text" id="endPlace" placeholder="np. Berlin">
    </div>

    <div class="grid-2">
        <div class="input-group">
            <label>Liczn. Początkowy (km):</label>
            <input type="number" id="startOdo" placeholder="np. 150000">
        </div>
        <div class="input-group">
            <label>Liczn. Końcowy (km):</label>
            <input type="number" id="endOdo" placeholder="np. 150350">
        </div>
    </div>

    <div class="grid-2">
        <div class="metric-box">
            <label>Przejechane km (z licznika)</label>
            <div class="val" id="calcKm">0.00 km</div>
        </div>
        <div class="metric-box">
            <label>Prędkość (GPS)</label>
            <div class="val" id="gpsSpeed" style="color: #4fc3f7;">0 km/h</div>
        </div>
    </div>

    <button class="btn btn-start" id="mainBtn" onclick="toggleRoute()">Start Trasy</button>

    <div class="grid-actions">
        <button class="btn btn-action" onclick="logEvent('Tankowanie')">Tankowanie</button>
        <button class="btn btn-action" onclick="logEvent('Załadunek')">Załadunek</button>
        <button class="btn btn-action" onclick="logEvent('Rozładunek')">Rozładunek</button>
        <button class="btn btn-action" onclick="logEvent('Pauza')">Pauza</button>
    </div>

    <button class="btn btn-stop" onclick="finishWork()">Zakończ Pracę</button>

    <div class="log-section">
        <strong>Dziennik zdarzeń i trasa:</strong>
        <div id="logContent" style="margin-top: 5px; max-height: 100px; overflow-y: auto; background: #121212; padding: 8px; border-radius: 6px;"></div>
    </div>
</div>

<script>
    let isRunning = false;
    let watchId = null;

    document.getElementById('startOdo').addEventListener('input', calculateOdometerKm);
    document.getElementById('endOdo').addEventListener('input', calculateOdometerKm);

    function calculateOdometerKm() {
        const start = parseFloat(document.getElementById('startOdo').value) || 0;
        const end = parseFloat(document.getElementById('endOdo').value) || 0;
        const calcBox = document.getElementById('calcKm');

        if (end > start) {
            const diff = end - start;
            calcBox.textContent = diff.toFixed(2) + " km";
        } else {
            calcBox.textContent = "0.00 km";
        }
    }

    function toggleRoute() {
        isRunning = !isRunning;
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('appStatus');
        
        if (isRunning) {
            btn.textContent = "Zatrzymaj Trasę";
            btn.style.backgroundColor = "#d32f2f";
            status.textContent = "W trasie";
            startGPS();
            logEvent("Rozpoczęcie trasy");
        } else {
            btn.textContent = "Start Trasy";
            btn.style.backgroundColor = "#388e3c";
            status.textContent = "Stop";
            stopGPS();
            logEvent("Zatrzymanie trasy");
        }
    }

    function startGPS() {
        if ("geolocation" in navigator) {
            document.getElementById('gpsStatus').textContent = "GPS: Aktywny";
            watchId = navigator.geolocation.watchPosition(position => {
                const speedMs = position.coords.speed;
                const speedKmh = speedMs ? (speedMs * 3.6).toFixed(0) : 0;
                document.getElementById('gpsSpeed').textContent = speedKmh + " km/h";
            }, error => {
                document.getElementById('gpsStatus').textContent = "GPS: Błąd sygnału";
            }, { enableHighAccuracy: true });
        } else {
            document.getElementById('gpsStatus').textContent = "GPS: Niedostępny";
        }
    }

    function stopGPS() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        document.getElementById('gpsSpeed').textContent = "0 km/h";
        document.getElementById('gpsStatus').textContent = "GPS: Gotowy";
    }

    function logEvent(type) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const logContent = document.getElementById('logContent');
        logContent.innerHTML += `<div>[${time}] ${type}</div>`;
        logContent.scrollTop = logContent.scrollHeight;
    }

    function finishWork() {
        if (isRunning) toggleRoute();
        alert("Zakończono pracę i zapisano raport!");
    }
</script>

</body>
</html>
