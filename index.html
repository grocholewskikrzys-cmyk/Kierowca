<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kierowca GPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff5252;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.active {
            background-color: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }
        .route-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-start {
            background-color: #1976D2;
        }
        .btn-stop {
            background-color: #D32F2F;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .metric-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .metric-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }
        .actions-section h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .action-btn {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:active {
            background-color: #383838;
        }
        .log-box {
            background-color: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #b0bec5;
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1><span id="statusDot" class="status-indicator"></span>Kierowca</h1>
        <div id="statusText" style="margin-bottom: 12px; font-size: 14px; color: #aaa;">Gotowy do jazdy</div>
        
        <input type="text" id="routeInput" class="route-input" placeholder="np. Gadki → Poznań">
        
        <div class="btn-group">
            <button class="btn btn-start" onclick="startTracking()">Start trasy</button>
            <button class="btn btn-stop" onclick="stopTracking()">Zakończ trasę</button>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">Dystans</div>
            <div class="metric-value" id="distance">0.00 KM</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Czas trwania</div>
            <div class="metric-value" id="timer">00:00</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Prędkość</div>
            <div class="metric-value" id="speed">0 KM/H</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Punkty GPS</div>
            <div class="metric-value" id="gpsPoints">0</div>
        </div>
    </div>

    <div class="card actions-section">
        <h3>Czynność</h3>
        <div class="actions-grid">
            <button class="action-btn" onclick="logAction('📦 Załadunek')">📦 Załadunek</button>
            <button class="action-btn" onclick="logAction('📤 Rozładunek')">📤 Rozładunek</button>
            <button class="action-btn" onclick="logAction('🔄 Przeładunek')">🔄 Przeładunek</button>
            <button class="action-btn" onclick="logAction('⛽ Tankowanie')">⛽ Tankowanie</button>
            <button class="action-btn" onclick="logAction('⏸️ Postój')">⏸️ Postój</button>
            <button class="action-btn" onclick="logAction('📝 Inne')">📝 Inne</button>
        </div>
    </div>

    <div class="card">
        <h3 style="font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase;">Dziennik zdarzeń:</h3>
        <div id="logBox" class="log-box">Gotowy do pracy...</div>
    </div>
</div>

<script>
    let watchId = null;
    let startTime = null;
    let timerInterval = null;
    let totalDistance = 0;
    let lastPosition = null;
    let gpsCount = 0;

    function getTimestamp() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
    }

    function log(message) {
        const box = document.getElementById('logBox');
        box.innerHTML += `<div>[${getTimestamp()}] ${message}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Promień Ziemi w metrach
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c; // Wynik w metrach
    }

    function startTracking() {
        const routeName = document.getElementById('routeInput').value || 'Trasa bez nazwy';
        if (watchId !== null) return;

        if (!navigator.geolocation) {
            alert('Twoja przeglądarka nie wspiera geolokalizacji.');
            return;
        }

        document.getElementById('statusDot').classList.add('active');
        document.getElementById('statusText').innerText = 'Śledzenie aktywne: ' + routeName;
        log(`Rozpoczęto trasę: ${routeName}`);

        startTime = new Date();
        timerInterval = setInterval(updateTimer, 1000);

        watchId = navigator.geolocation.watchPosition(
            (position) => {
                gpsCount++;
                document.getElementById('gpsPoints').innerText = gpsCount;

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speedMs = position.coords.speed;
                
                if (speedMs !== null && speedMs >= 0) {
                    const speedKmh = Math.round(speedMs * 3.6);
                    document.getElementById('speed').innerText = speedKmh + ' KM/H';
                }

                const currentPos = { lat, lon };
                if (lastPosition) {
                    const distanceMeters = calculateDistance(lastPosition.lat, lastPosition.lon, currentPos.lat, currentPos.lon);
                    if (distanceMeters > 3) { // Ignoruj małe szumy poniżej 3 metrów
                        totalDistance += distanceMeters;
                        document.getElementById('distance').innerText = (totalDistance / 1000).toFixed(2) + ' KM';
                    }
                }
                lastPosition = currentPos;
            },
            (error) => {
                log(`Błąd GPS: ${error.message}`);
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
    }

    function stopTracking() {
        if (watchId === null) return;

        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        clearInterval(timerInterval);

        document.getElementById('statusDot').classList.remove('active');
        document.getElementById('statusText').innerText = 'Zatrzymano trasę';
        log('Zatrzymano śledzenie.');
    }

    function logAction(actionName) {
        log(`Zdarzenie: ${actionName}`);
    }

    function updateTimer() {
        const now = new Date();
        const diff = Math.floor((now - startTime) / 1000);
        const hours = String(Math.floor(diff / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        const seconds = String(diff % 60).padStart(2, '0');
        document.getElementById('timer').innerText = hours > 0 ? `${hours}:${minutes}:${seconds}` : `${minutes}:${seconds}`;
    }
</script>

</body>
</html>
